[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.sms]
# Phone + password login. Confirmations off so sign-up returns a session with no
# SMS code (mirrors the hosted project's sms_autoconfirm) — no SMS provider
# required. The hosted project is configured the same way via the dashboard.
enable_signup = true
enable_confirmations = false

[functions.delete-account]
verify_jwt = true

[functions.send-sms]
# Called by the send_appointment_sms DB trigger via pg_net, not by end users.
# Authenticated with the x-sms-secret header (SMS_WEBHOOK_SECRET), not a JWT.
verify_jwt = false

[functions.request-booking-otp]
# Public guest-booking phone verification (step 1). Rate-limited per phone.
verify_jwt = false

[functions.verify-booking-otp]
# Public guest-booking phone verification (step 2). Attempt-limited.
verify_jwt = false

[functions.request-password-reset]
# Public password-recovery OTP (step 1). Neutral: only texts a code when the
# phone has an account; always returns ok. Rate-limited per phone.
verify_jwt = false

[functions.reset-password]
# Public password-recovery OTP (step 2). Verifies the code and sets the new
# password via auth.admin. Attempt-limited.
verify_jwt = false

[functions.create-payment]
# Starts a payment checkout. Public for the guest appointment flow; the
# subscription flow re-checks the caller's JWT inside the function.
verify_jwt = false

[functions.payment-webhook]
# Settles a payment. Called by the gateway callback (x-payment-secret) or, for
# the mock provider, by the /pay/mock checkout screen.
verify_jwt = false

[functions.api]
# Public REST API for business integrations. Auth is a per-org API key
# (x-api-key, checked in-function against api_keys) — not a Supabase JWT.
verify_jwt = false

[functions.refund-payment]
# Admin cancel-with-refund: changes the appointment status AND refunds the
# online charge in one call. Org membership re-checked in-function.
verify_jwt = true
