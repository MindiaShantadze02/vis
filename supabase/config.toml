[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[functions.get-available-slots]
verify_jwt = false

[functions.book-appointment]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.send-sms]
# Called by the send_appointment_sms DB trigger via pg_net, not by end users.
# Authenticated with the x-sms-secret header (SMS_WEBHOOK_SECRET), not a JWT.
verify_jwt = false

[functions.request-booking-otp]
# Public guest-booking phone verification (step 1). Rate-limited per phone.
verify_jwt = false

[functions.verify-booking-otp]
# Public guest-booking phone verification (step 2). Attempt-limited.
verify_jwt = false
